# Универсальный справочник, не привязан к конкретному ТЗ.
# Словари для детерминированных правил проверки (rules.py).

# Значения-заглушки целиком (сравнение без учёта регистра).
placeholder_values: ["", "-", "—", "–", "--", "---", "tbd", "todo", "n/a", "na", "???", "?", "...", "…",
                     "xxx", "уточнить", "уточняется", "будет позже", "<>", "-//-"]
# Заглушки внутри текста (с границами слов).
placeholder_tokens: ["TBD", "TODO", "FIXME", "???", "XXX", "<уточнить>", "[уточнить]"]
# Фразы-заглушки, из которых состоит «пустой» раздел (начало блока).
stub_phrases: ["заполня", "будет добавлен", "будет заполнен", "будет описан", "будет уточн", "в разработке",
               "tbd", "todo", "to be defined", "to be added", "to be done", "...", "…"]
# Признаки технического поля: плейсхолдер в нём = major.
technical_fields: ["url", "uri", "endpoint", "эндпоинт", "swagger", "openapi", "host", "хост", "адрес",
                   "сред", "environment", "prod", "dev", "stage", "test", "base", "path", "порт", "port",
                   "ip", "домен", "domain", "gitlab", "repository", "репозиторий"]
# Таблица подписей / согласования.
signature_markers: ["подпис", "согласова", "согласующ", "утвержд", "фио", "signature", "approv", "sign-off"]
# Варианты выбора в шаблонных чек-листах (неотмеченные, если перечислены все сразу).
choice_patterns: ["да\\s*/\\s*нет(\\s*/\\s*не\\s+требуется)?", "yes\\s*/\\s*no(\\s*/\\s*n/?a)?"]
# Версия и дата документа.
version_patterns: ["\\b(верси[яи]|редакци[яи]|version|ver\\.|rev\\.?)\\s*[:№#]?\\s*v?\\d+(\\.\\d+)*",
                   "\\bv\\d+\\.\\d+(\\.\\d+)?\\b"]
date_patterns: ["\\b\\d{1,2}[./]\\d{1,2}[./](\\d{4}|\\d{2})\\b", "\\b\\d{4}-\\d{2}-\\d{2}\\b",
                "\\b\\d{1,2}\\s+(январ|феврал|март|апрел|ма[яй]|июн|июл|август|сентябр|октябр|ноябр|декабр)\\w*\\s+\\d{4}"]
version_keys: ["верси", "редакци", "дата", "version", "date", "rev"]
version_missing: "(верси\\w*|дат\\w*|version|date)[^.\\n]{0,60}?\\bне\\s+(заполнен|указан|проставлен|определен|определён)\\w*"
# HTTP: методы, глаголы изменения (рус. основы и англ. слова), признаки API-раздела.
http_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS"]
mutation_ru: ["сохран", "созда", "измен", "обнов", "замен", "запис", "добав", "удал", "редактир"]
mutation_en: ["save", "create", "update", "set", "add", "insert", "delete", "remove", "edit", "modify"]
delete_verbs: ["удал", "delete", "remove"]
status_context: ["статус", "status", "код", "code", "http", "ответ", "результат", "возвращ", "response",
                 "error", "ошибк"]
api_section_words: ["api", "rest", "статус", "status", "endpoint", "эндпоинт", "запрос", "request", "response"]
body_absent: ["тело не используется", "тело запроса не используется", "тело отсутствует", "без тела",
              "body is not used", "no body", "body not used", "empty body"]
query_section_words: ["query", "query-параметр", "параметры строки запроса", "строка запроса"]
# Параметры-идентификаторы клиента и его продуктов (передавать в строке запроса небезопасно).
identifier_tokens: ["card", "pan", "account", "acct", "iban", "contract", "client", "customer", "passport",
                    "iin", "bin", "phone", "msisdn"]
identifier_ru: ["карт", "счет", "счёт", "договор", "клиент", "паспорт", "иин", "телефон"]

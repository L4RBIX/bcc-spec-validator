# Универсальный справочник, не привязан к конкретному ТЗ.
# Семейства единиц измерения. Правило «единицы» срабатывает, если в документе встречаются
# две разные группы одного семейства (например, основная и дробная единица одной валюты).
# mode: any -- считается любое упоминание единицы; number -- только рядом с числом и в одном разделе.
currency:
  mode: any
  families:
    KZT:
      - {name: "тенге", patterns: ["тенге", "₸", "KZT"]}
      - {name: "тиын", patterns: ["тиын*", "тийн*"]}
    RUB:
      - {name: "рубль", patterns: ["руб*", "₽", "RUB"]}
      - {name: "копейка", patterns: ["копе*", "коп."]}
    USD:
      - {name: "доллар", patterns: ["доллар*", "USD"]}
      - {name: "цент", patterns: ["цент*"]}
    EUR:
      - {name: "евро", patterns: ["евро", "€", "EUR"]}
      - {name: "евроцент", patterns: ["евроцент*"]}
    UZS:
      - {name: "сум", patterns: ["сум", "сума", "сумов", "UZS"]}
      - {name: "тийин", patterns: ["тийин*"]}
    KGS:
      - {name: "сом", patterns: ["сом", "сома", "сомов", "KGS"]}
      - {name: "тыйын", patterns: ["тыйын*"]}
measure:
  mode: number
  families:
    время:
      - {name: "миллисекунды", patterns: ["мс", "миллисекунд*", "ms"]}
      - {name: "секунды", patterns: ["сек", "сек.", "секунд*", "sec"]}
      - {name: "минуты", patterns: ["мин", "мин.", "минут*", "min"]}
      - {name: "часы", patterns: ["ч", "ч.", "час", "часа", "часов"]}
    объём данных:
      - {name: "килобайты", patterns: ["Кб", "КБ", "KB", "Kb", "килобайт*"]}
      - {name: "мегабайты", patterns: ["Мб", "МБ", "MB", "Mb", "мегабайт*"]}
      - {name: "гигабайты", patterns: ["Гб", "ГБ", "GB", "Gb", "гигабайт*"]}
